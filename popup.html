<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body { font: 14px/1.25 system-ui, "Segoe UI", sans-serif; width: 320px; margin: 0; padding: 10px; color: #1a1a1a; background: #fff; }
  h1 { font-size: 16px; margin: 0 0 7px; }
  button {
    display: block; width: 100%; margin: 0 0 5px; padding: 7px 10px; text-align: left;
    font: 600 15px/1.25 system-ui, "Segoe UI", sans-serif; color: #fff; background: #2e7d32;
    border: 0; border-radius: 10px; cursor: pointer;
  }
  button:hover { background: #1b5e20; }
  button.all { background: #1e88e5; }
  button.all:hover { background: #1565c0; }
  button.audio { background: #6345a0; }
  button.audio:hover { background: #4b327d; }
  button .media-kind { display: table; margin: 4px 0 2px; padding: 2px 6px; border-radius: 6px; background: #ffffff26; opacity: 1; font-weight: 600; }
  .muted { margin: 2px 0 5px; }
  button small { display: block; font-weight: 400; font-size: 12px; opacity: .9; margin-top: 1px; }
  ol { margin: 0; padding-left: 24px; }
  li { margin-bottom: 4px; }
  .muted { color: #555; font-size: 13px; }
  details { margin: 0 0 8px; font-size: 13px; color: #444; }
  summary { cursor: pointer; }
  select { display: block; width: 100%; margin-top: 5px; padding: 5px; border: 1px solid #ccc; border-radius: 6px; font: inherit; background: #fff; }
  .resource-mode { display: block; margin: 0 0 8px; padding: 6px 8px; background: #edf5ee; border-radius: 8px; font-size: 13px; }
  .resource-mode input { accent-color: #2e7d32; }
  .resource-mode small { display: block; color: #444; margin: 2px 0 0 23px; }
</style>
</head>
<body>
  <label class="resource-mode"><input id="lowResource" type="checkbox" checked> Экономный режим
    <small>До 720p по умолчанию · один ролик за раз · запись на диск</small>
  </label>
  <div id="root"></div>
  <script src="hls.js"></script>
  <script src="resource-mode.js"></script>
  <script src="popup.js"></script>
</body>
</html>
