<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.2 system-ui, "Segoe UI", sans-serif; width: 300px; margin: 0; padding: 8px; color: #1a1a1a; background: #fff; }
  h1 { font-size: 15px; margin: 0 0 5px; }
  button {
    display: block; width: 100%; margin: 0 0 4px; padding: 6px 8px; text-align: left;
    font: 600 14px/1.2 system-ui, "Segoe UI", sans-serif; color: #fff; background: #2e7d32;
    border: 0; border-radius: 8px; cursor: pointer;
  }
  button:hover { background: #1b5e20; }
  button:disabled { opacity: .65; cursor: default; }
  button.all { background: #1e88e5; }
  button.all:hover { background: #1565c0; }
  button.audio { background: #6345a0; }
  button.audio:hover { background: #4b327d; }
  button .media-kind { display: inline-block; margin: 3px 4px 1px 0; padding: 1px 5px; border-radius: 5px; background: #ffffff26; opacity: 1; font-weight: 600; }
  .muted { margin: 2px 0 4px; }
  button small { display: block; font-weight: 400; font-size: 11px; opacity: .9; margin-top: 1px; }
  ol { margin: 0; padding-left: 20px; }
  li { margin-bottom: 3px; }
  .muted { color: #555; font-size: 12px; }
  details { margin: 0 0 5px; font-size: 12px; color: #444; }
  summary { cursor: pointer; }
  select, .file-name input { box-sizing: border-box; display: block; width: 100%; margin-top: 4px; padding: 4px; border: 1px solid #ccc; border-radius: 6px; font: inherit; background: #fff; }
  .file-name { display: block; margin-top: 4px; }
  .resource-mode { display: block; margin: 0 0 6px; padding: 5px 7px; background: #edf5ee; border-radius: 7px; font-size: 12px; }
  .resource-mode input { accent-color: #2e7d32; }
  .resource-mode small { display: block; color: #444; margin: 1px 0 0 21px; font-size: 11px; }
</style>
</head>
<body>
  <label class="resource-mode"><input id="lowResource" type="checkbox" checked> Экономный режим
    <small>Лучшее качество · меньше RAM · запись на диск</small>
  </label>
  <div id="resume"></div>
  <div id="root"></div>
  <script src="hls.js"></script>
  <script src="resource-mode.js"></script>
  <script src="popup.js"></script>
</body>
</html>
