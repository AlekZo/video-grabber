<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body { font: 18px/1.4 system-ui, "Segoe UI", sans-serif; width: 340px; margin: 0; padding: 18px; color: #1a1a1a; background: #fff; }
  h1 { font-size: 20px; margin: 0 0 14px; }
  button {
    display: block; width: 100%; margin: 0 0 12px; padding: 16px 12px;
    font: 600 20px system-ui, "Segoe UI", sans-serif; color: #fff; background: #2e7d32;
    border: 0; border-radius: 12px; cursor: pointer;
  }
  button:hover { background: #1b5e20; }
  button.all { background: #1e88e5; }
  button.all:hover { background: #1565c0; }
  .muted { margin: 4px 0 12px; }
  button small { display: block; font-weight: 400; font-size: 14px; opacity: .9; margin-top: 2px; }
  ol { margin: 0; padding-left: 24px; }
  li { margin-bottom: 10px; }
  .muted { color: #555; font-size: 15px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="popup.js"></script>
</body>
</html>
